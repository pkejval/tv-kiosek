plugins { id 'com.android.application' }

android {
    namespace 'cz.kiosek.tv'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'cz.kiosek.tv'
        // GeckoView requires API 26; Android TV 10 is API 29.
        minSdk 26
        targetSdk 35
        // GitHub Actions passes the run number, so every release is newer.
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName(project.findProperty('versionName') ?: '0.0.0-dev')
    }

    // Updates install only over an APK signed with the same key. The release
    // keystore lives in GitHub secrets; see .github/workflows/release.yml.
    def keystorePath = System.getenv('KEYSTORE_FILE')
    if (keystorePath) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
        buildTypes {
            release { signingConfig signingConfigs.release }
        }
    }

    // GeckoView contains large native libraries. Produce one installable APK per
    // physical-TV architecture instead of shipping all architectures together.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
}

dependencies {
    // Engine is packaged with the APK, unlike the device's potentially obsolete WebView.
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159'
}
